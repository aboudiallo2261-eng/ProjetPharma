# ============================================================
# CI VetPharma — compile et teste à chaque push / pull request.
# Les tests initialisent Hibernate : un conteneur MySQL est donc
# démarré comme service, et un config.properties de CI est généré
# (le vrai config.properties est gitignoré, il contient les secrets).
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & Tests (Java 17 + MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: pharmacie_vet_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Générer le config.properties de CI (base MySQL du service)
        run: |
          cat > config.properties << 'EOF'
          db.url=jdbc:mysql://127.0.0.1:3306/pharmacie_vet_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
          db.username=root
          db.password=
          EOF

      - name: Compiler et exécuter les tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Publier les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-surefire
          path: target/surefire-reports/
